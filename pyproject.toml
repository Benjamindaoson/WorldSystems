[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldsystems"
version = "0.1.0"
description = "Reproducible training and inference for compact action-conditioned world models"
requires-python = ">=3.11"
dependencies = ["torch>=2.3", "numpy>=1.26", "PyYAML>=6", "safetensors>=0.4", "fastapi>=0.110", "uvicorn>=0.29"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires CUDA", "distributed: requires multiple processes"]

[tool.ruff]
line-length = 100
